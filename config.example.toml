state_dir = "~/.local/share/q-agent"

[provider]
name = "ollama"
model = "qwen3"
base_url = "http://127.0.0.1:11434"
# Credential variable defaults to OPENAI_API_KEY or OPENCODE_GO_API_KEY
# for those providers. An empty value uses the provider default.
api_key_env = ""
# Optional file containing the provider key. Mutually exclusive with
# api_key_env: clear api_key_env to use it. The file must be a regular
# file owned by the service user with mode 0600 or 0400, without symlinks.
# api_key_path = "~/.config/q-agent/provider.key"
thinking = ""

# Optional additional providers available to /provider in each chat/group.
# The table name selects the adapter; do not repeat the default provider here.
# Each needs a default model and its own URL/credential references.
# [providers.openai]
# model = "YOUR_OPENAI_MODEL"
# api_key_env = "OPENAI_API_KEY"
# thinking = ""
#
# [providers.opencode-go]
# model = "YOUR_OPENCODE_MODEL"
# api_key_env = "OPENCODE_GO_API_KEY"

[telegram]
token_env = "TELEGRAM_BOT_TOKEN"
# Optional file containing the Telegram bot token. Mutually exclusive with
# token_env: clear token_env to use it. Same strict file rules as api_key_path.
# token_path = "~/.config/q-agent/telegram.token"
approved_user_ids = [123456789]
approved_chat_ids = [123456789, -1001234567890]
# Optional: /update and /restart, only in approved private chats. Empty disables.
# Administrators must also be listed in approved_user_ids.
admin_user_ids = []

[sandbox]
enabled = false
base_image = "~/.local/share/q-agent/images/debian-trixie.tar"

[limits]
max_steps = 8
max_tool_calls = 16
max_concurrent = 2
task_timeout = "5m"
shell_timeout = "2m"
# Interactive shell-timeout prompt: when a host shell with output hits
# shell_timeout, the bot sends the last 3 lines and waits this long for
# `extend` or `kill`. Scheduled runs never prompt and terminate.
shell_prompt_timeout = "90s"
# Max user-approved extensions per shell call. Each extend adds one
# shell_timeout window; the overall task_timeout still caps the run.
shell_max_extends = 2

[memory]
# Nightly long-term memory digest. Successful tasks are journaled durably,
# independent of prompt history, per chat/group and shared across its topics.
enabled = true
# IANA timezone for the digest midnight; empty means server-local time.
timezone = ""
# Daily wall time for the digest sweep (HH:MM, 24-hour).
digest_at = "00:00"
# Total UTF-8 bytes of persisted note text (JSON metadata excluded).
# Compaction is attempted first; oldest notes are then dropped/trimmed to fit.
max_bytes = 8192
# UTF-8 bytes of the complete injected memory message, including formatting.
# Recent notes take priority; tiny budgets may inject no memory.
max_context_bytes = 2000
# Encoded pending-source journal cap (4 MiB). Oldest sources are evicted on
# overflow, with a warning and counters. No age expiry; event cap is 256 KiB.
max_pending_bytes = 4194304
# Optional digest model override; empty uses each chat's own model.
model = ""
