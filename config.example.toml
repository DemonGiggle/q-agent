state_dir = "~/.local/share/q-agent"

[provider]
name = "ollama"
model = "qwen3"
base_url = "http://127.0.0.1:11434"
# Credential variable defaults to OPENAI_API_KEY or OPENCODE_GO_API_KEY
# for those providers. An empty value uses the provider default.
api_key_env = ""
# Optional file containing the provider key. Mutually exclusive with
# api_key_env: clear api_key_env to use it. The file must be a regular
# file owned by the service user with mode 0600 or 0400, without symlinks.
# api_key_path = "~/.config/q-agent/provider.key"
# Thinking level for the default provider.
#   "" (auto) = omit the effort field; the backend decides. It never claims
#     equality with a concrete level (low/medium/...).
#   "high" etc = send that effort on every request unless a chat overrides it
#     with /think.
# Chat overrides: /think <level|auto> sets this chat only, /think default
# clears the override and restores this configured value.
# Codex (chatgpt provider): the live catalog's default_reasoning_level is what
# the Codex CLI sends when unset; q-agent omits effort when auto, which is a
# different behavior. Bare /think shows both. `ultra`/`persistent`/`custom`
# are client-only in v1 and are rejected, never silently downgraded.
# Summary is omitted by default; effort and summary are independent.
thinking = ""

# Optional additional providers available to /provider in each chat/group.
# The table name selects the adapter; do not repeat the default provider here.
# Each needs a default model and its own URL/credential references.
# [providers.openai]
# model = "YOUR_OPENAI_MODEL"
# api_key_env = "OPENAI_API_KEY"
# thinking = ""
#
# [providers.opencode-go]
# model = "YOUR_OPENCODE_MODEL"
# api_key_env = "OPENCODE_GO_API_KEY"
#
# ChatGPT subscription (no API key). Run `q-agent login chatgpt` first,
# then use `q-agent models set-default --provider chatgpt --model gpt-5.6-codex`
# to make it the default, or `q-agent models add --provider chatgpt --model gpt-5.6-codex`
# to offer it as an extra via /provider.
# [providers.chatgpt]
# model = "gpt-5.6-codex"

# ChatGPT OAuth file written by `q-agent login chatgpt`. Empty uses the
# default ~/.config/q-agent/chatgpt-oauth.json (0600, owner-only, no symlink).
# [chatgpt]
# oauth_path = "~/.config/q-agent/chatgpt-oauth.json"

[telegram]
token_env = "TELEGRAM_BOT_TOKEN"
# Optional file containing the Telegram bot token. Mutually exclusive with
# token_env: clear token_env to use it. Same strict file rules as api_key_path.
# token_path = "~/.config/q-agent/telegram.token"
# Private 1:1 contacts: one entry authorizes that private chat (ChatID == UserID).
allowed_users = [123456789]
# Groups/channels: anyone in a listed group can talk; no per-user listing needed.
allowed_groups = [-1001234567890]
# Optional: /update and /restart, only in allowed private chats. Empty disables.
# Administrators must also be listed in allowed_users.
admin_user_ids = []

[sandbox]
enabled = false
base_image = "~/.local/share/q-agent/images/debian-trixie.tar"

[limits]
max_steps = 8
max_concurrent = 2
task_timeout = "5m"
# Total task budget from task start after opening a managed process session.
# Never shortens a longer task_timeout.
interactive_task_timeout = "15m"
shell_timeout = "2m"
# Interactive shell-timeout prompt: when a host shell with output hits
# shell_timeout, the bot sends the last 3 lines and waits this long for
# `extend` or `kill`. Scheduled runs never prompt and terminate.
shell_prompt_timeout = "90s"
# Max user-approved extensions per shell call. Each extend adds one
# shell_timeout window; the overall task_timeout still caps the run.
shell_max_extends = 2

[memory]
# Nightly long-term memory digest. Successful tasks are journaled durably,
# independent of prompt history, per chat/group and shared across its topics.
enabled = true
# IANA timezone for the digest midnight; empty means server-local time.
timezone = ""
# Daily wall time for the digest sweep (HH:MM, 24-hour).
digest_at = "00:00"
# Total UTF-8 bytes of persisted note text (JSON metadata excluded).
# Compaction is attempted first; oldest notes are then dropped/trimmed to fit.
# Cap is 1048576.
max_bytes = 8192
# UTF-8 bytes of the complete injected memory message, including formatting.
# Recent notes take priority; tiny budgets may inject no memory.
# Cap is 200000.
max_context_bytes = 2000
# Encoded pending-source journal cap (4 MiB). Oldest sources are evicted on
# overflow, with a warning and counters. No age expiry; event cap is 256 KiB.
# Cap is 67108864.
max_pending_bytes = 4194304
# Optional digest model override; empty uses each chat's own model.
model = ""

[proactive]
# Quiet companion check-ins. On by default; enabled=false is the kill switch
# (no goroutine, no extra LLM/history reads, no queue writes). Existing
# installs auto-enable on next load unless they set enabled=false.
enabled = true
# IANA timezone for the active window; empty means server-local time.
timezone = ""
# Active hours the companion may wake in (HH:MM-HH:MM, 24-hour).
# Wake-ups inside the window are randomized, a few times per day.
active_time = "09:00-22:00"
# At most one proactive message per chat per sweep, capped per day.
max_per_day = 1
# Minimum gap between two proactive messages to the same chat.
cooldown = "6h"
# Skip chats with recent activity to avoid interrupting live conversation.
skip_recent_activity = "60m"
# Optional model override; empty uses each chat's own model.
model = ""
# Allowed kinds; unknown kinds are rejected. Silence is always allowed.
kinds = ["reminder", "warmth", "comfort", "suggestion"]
# Group policy: conservative (groups only get reminders), off (skip groups), same (as private).
group_policy = "conservative"
