state_dir = "~/.local/share/q-agent"

[provider]
name = "ollama"
model = "qwen3"
base_url = "http://127.0.0.1:11434"
# Credential variable defaults to OPENAI_API_KEY or OPENCODE_GO_API_KEY
# for those providers. An empty value uses the provider default.
api_key_env = ""
# Optional file containing the provider key. Mutually exclusive with
# api_key_env: clear api_key_env to use it. The file must be a regular
# file owned by the service user with mode 0600 or 0400, without symlinks.
# api_key_path = "~/.config/q-agent/provider.key"
thinking = ""

[telegram]
token_env = "TELEGRAM_BOT_TOKEN"
# Optional file containing the Telegram bot token. Mutually exclusive with
# token_env: clear token_env to use it. Same strict file rules as api_key_path.
# token_path = "~/.config/q-agent/telegram.token"
approved_user_ids = [123456789]
approved_chat_ids = [123456789, -1001234567890]

[sandbox]
enabled = false
base_image = "~/.local/share/q-agent/images/debian-trixie.tar"

[limits]
max_steps = 8
max_tool_calls = 16
max_concurrent = 2
task_timeout = "5m"
shell_timeout = "2m"
